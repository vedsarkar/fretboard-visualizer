<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Freetboard checks</title>
  </head>
  <body>
    <pre id="results" style="font: 12px ui-monospace, monospace">running…</pre>
    <div id="mount"></div>
    <div id="probe"></div>
    <script type="module">
      import { createRoot } from 'react-dom/client';
      import { createElement } from 'react';
      import App from '/src/App.jsx';
      import { Fretboard } from '/src/components/Fretboard.jsx';
      import * as theory from '/src/lib/theory.js';
      import * as kb from '/src/lib/keyboard.js';
      import * as seq from '/src/lib/sequencer.js';
      import * as S from '/src/lib/state.js';
      import * as layout from '/src/lib/layout.js';
      import { svgToPng } from '/src/lib/layout.js';
      import '/src/index.css';
      import '/src/app.css';

      const lines = [];
      const out = document.getElementById('results');
      // Written as we go so a hang shows the last check that got through.
      const log = (name, pass, detail = '') => {
        lines.push(`${pass ? 'PASS' : 'FAIL'} ${name}${detail ? ' :: ' + detail : ''}`);
        out.textContent = lines.join('\n');
      };

      const tick = () => new Promise((resolve) => setTimeout(resolve, 30));
      const root = document.getElementById('mount');
      const byId = (id, scope = root) => scope.querySelector(`[data-testid="${id}"]`);
      const inGroup = (id) => [...byId(id).querySelectorAll('button')];
      const byText = (text, scope = root) =>
        [...scope.querySelectorAll('button')].find((b) => b.textContent.trim() === text);

      // SVG nodes have no .click(); React's delegated listener still sees a
      // bubbling MouseEvent.
      const fire = (node, type, detail) =>
        node.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, detail }));
      const click = async (node) => {
        if (typeof node.click === 'function') node.click();
        else fire(node, 'click', 1);
        await tick();
      };
      const doubleClick = async (node) => {
        fire(node, 'dblclick', 2);
        await tick();
      };

      const board = () => byId('fretboard').querySelector('svg');
      const markers = () => root.querySelectorAll('.fb-note');
      const dotLabels = () => [...root.querySelectorAll('.fb-note text')].map((t) => t.textContent);
      const readout = (id) => byId(id).textContent.trim();
      const openLabelsIn = (svg) =>
        [...svg.querySelectorAll('text')]
          .filter((t) => /^[A-G]#?\d$/.test(t.textContent))
          .map((t) => ({ name: t.textContent, y: Number(t.getAttribute('y')) }))
          .sort((a, b) => a.y - b.y)
          .map((t) => t.name);

      try {
        localStorage.clear();

        /* ---------------- pure theory ---------------- */
        log('E2 is MIDI 40', theory.nameToMidi('E2') === 40);
        log('C4 is MIDI 60', theory.nameToMidi('C4') === 60);
        log('A4 = 440Hz', Math.abs(theory.midiToFreq(69) - 440) < 1e-9);
        log('all 25 tunings parse', theory.ALL_TUNINGS.length === 25 &&
          theory.ALL_TUNINGS.every((t) => t.notes.every((n) => Number.isFinite(theory.nameToMidi(n)))));
        log('40 scales, rooted and sorted', theory.ALL_SCALES.length === 40 &&
          theory.ALL_SCALES.every((s) => s.intervals[0] === 0 &&
            s.intervals.every((v, i, a) => v >= 0 && v < 12 && (i === 0 || v > a[i - 1]))));
        log('20 chords, rooted and sorted', theory.ALL_CHORDS.length === 20 &&
          theory.ALL_CHORDS.every((c) => c.intervals[0] === 0 &&
            c.intervals.every((v, i, a) => v >= 0 && v < 12 && (i === 0 || v > a[i - 1]))));
        log('interval labels are the plain spellings',
          theory.INTERVAL_LABEL.join(' ') === 'P1 m2 M2 m3 M3 P4 d5 P5 m6 M6 m7 M7',
          theory.INTERVAL_LABEL.join(' '));
        log('every interval name keeps its enharmonic', theory.INTERVAL_NAME.length === 12 &&
          theory.INTERVAL_NAME.slice(1).every((n) => n.includes(' / ')));

        /* ---------------- keyboard sizes ---------------- */
        log('every keyboard size spans exactly its key count',
          theory.KEY_COUNTS.every(({ count }) => {
            const { lowMidi, highMidi } = theory.keyRangeMidi(count);
            return highMidi - lowMidi + 1 === count;
          }),
          theory.KEY_COUNTS.map((k) => `${k.count}:${k.low}-${k.high}`).join(' '));
        log('88 keys run A0 to C8', theory.keyRangeMidi(88).lowMidi === 21 &&
          theory.keyRangeMidi(88).highMidi === 108);
        log('an unknown keyboard size falls back to 61', theory.keyRangeMidi(37).lowMidi ===
          theory.keyRangeMidi(61).lowMidi);

        /* ---------------- keyboard geometry ---------------- */
        const layoutFor = (count) => kb.computeKeyboardLayout({ keyCount: count });
        log('each keyboard size lays out exactly its key count',
          theory.KEY_COUNTS.every(({ count }) => layoutFor(count).keys.length === count));
        log('white keys per size are 52 45 36 29 15',
          theory.KEY_COUNTS.map((k) => layoutFor(k.count).whites.length).join(' ') ===
          '52 45 36 29 15',
          theory.KEY_COUNTS.map((k) => layoutFor(k.count).whites.length).join(' '));
        log('whites and blacks account for every key',
          theory.KEY_COUNTS.every(({ count }) => {
            const L = layoutFor(count);
            return L.whites.length + L.blacks.length === count;
          }));
        log('an unknown size falls back to the 61-key layout',
          layoutFor(37).keys.length === 61);
        log('keys are laid out strictly left to right',
          theory.KEY_COUNTS.every(({ count }) =>
            layoutFor(count).keys.every((k, i, all) => i === 0 || k.x > all[i - 1].x)));
        log('every black key overlaps the two whites it sits between',
          (() => {
            const L = layoutFor(88);
            return L.keys.every((k, i, all) => {
              if (!k.black) return true;
              const left = all[i - 1];
              const right = all[i + 1];
              return k.x > left.x && k.x + k.w < right.x + right.w;
            });
          })());
        log('black keys are offset, not centred on the seam',
          (() => {
            const L = layoutFor(61);
            /* A naive layout centres every black key on the seam, making all
               these deltas identical. Real key cutting varies them. */
            const deltas = new Set(
              L.blacks.map((k) => Math.round((k.cx % L.whiteWidth) * 100) / 100),
            );
            return deltas.size > 1;
          })());
        log('note dots never straddle a black key edge',
          (() => {
            const L = layoutFor(88);
            return L.blacks.every((k) => k.cy + L.noteRadius <= k.y + k.h);
          })());
        log('white-key dots sit clear of the black keys above them',
          (() => {
            const L = layoutFor(88);
            const blackBottom = L.blacks[0].y + L.blacks[0].h;
            return L.whites.every((k) => k.cy - L.noteRadius > blackBottom);
          })());
        log('the keyboard palette reuses the fretboard palette',
          kb.KEY_COLORS.white === layout.COLORS.board &&
          kb.KEY_COLORS.black === layout.COLORS.fret &&
          kb.KEY_COLORS.rootRing === layout.COLORS.rootRing);

        /* ---------------- extra low strings ---------------- */
        const spell = (midis) => midis.map((m) => theory.noteNameOctave(m, false)).join(' ');
        const guitar = theory.findTuning('standard');
        log('7th string is B1', spell(theory.extendedTuningMidi(guitar, 0, 1)) === 'B1 E2 A2 D3 G3 B3 E4',
          spell(theory.extendedTuningMidi(guitar, 0, 1)));
        log('8th string is F#1', spell(theory.extendedTuningMidi(guitar, 0, 2)) === 'F#1 B1 E2 A2 D3 G3 B3 E4',
          spell(theory.extendedTuningMidi(guitar, 0, 2)));
        log('added strings match the shipped 7-string tuning',
          spell(theory.extendedTuningMidi(guitar, 0, 1)) === spell(theory.tuningMidi(theory.findTuning('guitar-7'))));
        log('added strings match the shipped 8-string tuning',
          spell(theory.extendedTuningMidi(guitar, 0, 2)) === spell(theory.tuningMidi(theory.findTuning('guitar-8'))));
        log('extra strings follow transposition',
          spell(theory.extendedTuningMidi(guitar, 2, 1)) === 'C#2 F#2 B2 E3 A3 C#4 F#4',
          spell(theory.extendedTuningMidi(guitar, 2, 1)));
        log('5th bass string is B0',
          spell(theory.extendedTuningMidi(theory.findTuning('bass-4'), 0, 1)) === 'B0 E1 A1 D2 G2',
          spell(theory.extendedTuningMidi(theory.findTuning('bass-4'), 0, 1)));
        log('re-entrant ukulele adds below its lowest pitch',
          theory.extendedTuningMidi(theory.findTuning('ukulele'), 0, 1)[0] === 55,
          spell(theory.extendedTuningMidi(theory.findTuning('ukulele'), 0, 1)));

        /* ---------------- patterns ---------------- */
        const pool = seq.notePool({ rootPc: 0, intervals: [0, 2, 4, 5, 7, 9, 11], lowMidi: 40, highMidi: 64, octaves: 1 });
        log('one-octave C pool is 8 notes', pool.length === 8, pool.join(','));
        const upFour = seq.buildSequence(pool, { length: 4, jump: 1, perm: [0, 1, 2, 3], direction: 'up' });
        log('1234 pattern head', upFour.slice(0, 5).join(',') === [pool[0], pool[1], pool[2], pool[3], pool[1]].join(','), upFour.slice(0, 8).join(','));
        const thirds = seq.buildSequence(pool, { length: 2, jump: 2, perm: [0, 1], direction: 'up' });
        log('thirds step 2 degrees', thirds[1] === pool[2] && thirds[2] === pool[1]);
        log('perm count for 4 = 24', seq.permutations(4).length === 24);
        log('perm label', seq.permutationLabel([0, 2, 1, 3]) === '1324');

        /* ---------------- metronome ---------------- */
        log('4/4 counts four beats', seq.findMeter('4/4').beats === 4);
        log('an unknown meter falls back to 4/4', seq.findMeter('nope').id === '4/4');
        const sevens = seq.findMeter('7/8 (3+2+2)');
        log('7/8 groups as 3+2+2', sevens.beats === 7 && sevens.accents.join(',') === '3,5');

        // A silent stand-in: the clock only needs a clock and a click sink.
        const taps = [];
        const fakeAudio = {
          time: 0,
          ensure: () => {},
          click: (when, level) => taps.push({ when, level }),
        };
        const clock = new seq.MetronomeClock(fakeAudio);
        clock.configure({ beats: 7, accents: sevens.accents, subdivision: 1 });
        log('the downbeat is the accent', clock.level(0, false) === 'accent');
        log('group starts are stressed', clock.level(3, false) === 'group');
        log('plain beats are plain', clock.level(1, false) === 'beat');
        log('subdivisions stay quiet', clock.level(3, true) === 'sub');

        // Two bars of 4/4 in eighths at 120bpm: 0.25s a click, 16 clicks in 4s.
        // The scheduler only fills its lookahead window, so the clock has to be
        // wound forward the way the audio context would advance it.
        taps.length = 0;
        clock.configure({ beats: 4, accents: [], subdivision: 2 });
        clock.tempo = 120;
        clock.playing = true;
        clock._step = 0;
        clock._nextStepTime = 0;
        for (fakeAudio.time = 0; fakeAudio.time < 4; fakeAudio.time += 0.05) clock._schedule();
        clock.playing = false;
        const eighths = taps.filter((t) => t.when < 4);
        log('eighths land twice a beat', eighths.length === 16, String(eighths.length));
        log('every other eighth is offbeat', eighths[1].level === 'sub' && eighths[2].level === 'beat');
        log('the bar restarts on the accent', eighths[8].level === 'accent',
          eighths.slice(0, 9).map((t) => t.level[0]).join(''));

        /* ---------------- reducer ---------------- */
        const base = S.initialState;
        log('default is a 24-fret neck', base.fretCount === 24, String(base.fretCount));

        let st = S.reducer(base, { type: 'setIntervals', semitones: [0, 3, 7] });
        log('setIntervals enters custom mode', st.useCustom && st.customIntervals.join(',') === '0,3,7');
        st = S.reducer(base, { type: 'setIntervals', semitones: [] });
        log('emptying intervals keeps the root', st.customIntervals.join(',') === '0');
        st = S.reducer(base, { type: 'setIntervals', semitones: [7, 0, 3] });
        log('setIntervals sorts', st.customIntervals.join(',') === '0,3,7');

        st = S.reducer(base, { type: 'setStrings', on: [0, 1], total: 6 });
        log('setStrings stores the complement', st.stringsOff.join(',') === '2,3,4,5', st.stringsOff.join(','));
        st = S.reducer(base, { type: 'setStrings', on: [0, 1, 2, 3, 4, 5], total: 6 });
        log('all strings on means none muted', st.stringsOff.length === 0);

        st = S.reducer(base, { type: 'selectChord', id: 'maj7' });
        log('selectChord switches mode', st.mode === 'chords' && st.chordId === 'maj7');

        log('the board starts on guitar', base.board === 'guitar' && base.keyCount === 61);
        st = S.reducer(base, { type: 'setBoard', board: 'piano' });
        log('setBoard switches instrument', st.board === 'piano');
        st = S.reducer(st, { type: 'setKeyCount', count: 88 });
        log('setKeyCount keeps the piano selected', st.board === 'piano' && st.keyCount === 88);
        st = S.reducer(base, { type: 'clamp', field: 'tempo', delta: -1000, min: 30, max: 300 });
        log('tempo clamps at 30', st.tempo === 30);
        st = S.reducer({ ...base, notesPerBeat: 4 }, { type: 'cycle', field: 'notesPerBeat', values: [1, 2, 3, 4] });
        log('cycle wraps', st.notesPerBeat === 1);
        st = S.reducer({ ...base, groupLength: 3, permIndex: 5 }, { type: 'cycle', field: 'groupLength', values: [1, 2, 3, 4] });
        log('changing group resets permutation', st.permIndex === 0);
        st = S.reducer({ ...base, transpose: 3, stringsOff: [1], extraStrings: 2 }, { type: 'setTuning', id: 'bass-4' });
        log('changing tuning clears transpose, mutes and extra strings',
          st.transpose === 0 && st.stringsOff.length === 0 && st.extraStrings === 0);

        st = S.reducer({ ...base, stringsOff: [1], painted: { '0:3': '#fff' } }, { type: 'setExtraStrings', extra: 1 });
        log('adding a string clears mutes and marks',
          st.extraStrings === 1 && st.stringsOff.length === 0 && Object.keys(st.painted).length === 0);
        log('adding a string grows the board', S.stringCount(st) === 7, String(S.stringCount(st)));
        st = S.reducer(base, { type: 'setExtraStrings', extra: 5 });
        log('extra strings stop at eight total', S.stringCount(st) === 8, String(S.stringCount(st)));
        st = S.reducer(base, { type: 'setExtraStrings', extra: -1 });
        log('extra strings never go negative', st.extraStrings === 0);
        log('an 8-string tuning takes no extras',
          S.extraStringsAllowed({ ...base, tuningId: 'guitar-8' }) === 0);
        log('a 6-string tuning takes two extras', S.extraStringsAllowed(base) === 2);
        log('positionsFor prefers low frets', S.positionsFor(base, 60)[0].fret <= 8);

        /* ---------------- renderer, in isolation ---------------- */
        const probe = document.getElementById('probe');
        const ukulele = {
          strings: [67, 60, 64, 69], // G4 C4 E4 A4, re-entrant
          fretCount: 5,
          leftHanded: false,
          flats: false,
          showDegrees: false,
          stringEnabled: [true, true, true, true],
          pitches: new Map([[0, { degree: 0, semitones: 0 }]]),
          painted: {},
          spotlight: null,
        };
        createRoot(probe).render(
          createElement(Fretboard, { view: ukulele, flash: { key: '', id: 0 }, onSelect() {}, onSpotlight() {} }),
        );
        await tick();
        const probeSvg = probe.querySelector('svg');
        log('re-entrant ukulele keeps G4 order', openLabelsIn(probeSvg).join(' ') === 'A4 E4 C4 G4',
          openLabelsIn(probeSvg).join(' '));
        const png = await svgToPng(probeSvg, { scale: 1, title: 'test' });
        log('PNG export produces a blob', png && png.size > 1000, png ? `${png.size} bytes` : 'null');

        /* ---------------- mount the app ---------------- */
        createRoot(root).render(createElement(App));
        await tick();

        log('app mounts with notes', markers().length > 80, `${markers().length} markers`);
        log('C major spelled naturally', [...new Set(dotLabels())].sort().join('') === 'ABCDEFG',
          [...new Set(dotLabels())].join(' '));
        log('fret readout starts at 24', readout('frets-value') === '24', readout('frets-value'));
        log('shadcn tokens applied',
          getComputedStyle(document.documentElement).getPropertyValue('--primary').trim().length > 0,
          getComputedStyle(document.documentElement).getPropertyValue('--primary').trim());

        // Root note. The Select renders its list in a portal on open, so the
        // respelling itself is checked through the reducer instead.
        log('root reads C on the select', readout('root-select').replace(/\s+/g, '') === 'RootC',
          readout('root-select').replace(/\s+/g, ''));
        const inD = S.pitchMap({ ...S.initialState, rootPc: 2 });
        log('D major spells F# and C#', inD.has(6) && inD.has(1));

        // Notation. C major has no accidentals, so borrow a minor third from the
        // interval row to give the flat toggle something to respell.
        await click(inGroup('interval-group')[3]);
        log('added minor third spells D#', dotLabels().includes('D#'),
          [...new Set(dotLabels())].join(' '));
        await click(byId('notation-toggle'));
        log('flat toggle respells D# as Eb', dotLabels().includes('Eb'),
          [...new Set(dotLabels())].join(' '));
        await click(byId('notation-toggle'));
        await click(inGroup('interval-group')[3]);
        log('dropping the third restores the major scale', !dotLabels().includes('D#'),
          [...new Set(dotLabels())].join(' '));

        await click(byId('degree-toggle'));
        const degreeSet = new Set(dotLabels());
        log('degree labels valid',
          [...degreeSet].every((l) => theory.DEGREE_LABEL.includes(l)) && degreeSet.has('1'),
          [...degreeSet].join(' '));
        await click(byId('degree-toggle'));

        // Piano swaps the guitar-only controls for a keyboard size picker
        await click(byText('Piano', byId('mode-group')));
        log('piano shows the keyboard', Boolean(byId('keyboard')) && !byId('fretboard'));
        log('piano offers a keys picker, defaulting to 61 keys',
          byId('keys-select')?.textContent.replace(/\s+/g, '').startsWith('Keys61'),
          byId('keys-select')?.textContent.trim());
        log('piano drops the guitar-only controls',
          !byId('instrument-select') && !byId('hand-toggle') && !byId('strings-value') &&
          !byId('tune-value') && !byId('frets-value'));
        log('piano keeps root, notation and degree controls',
          Boolean(byId('root-select') && byId('notation-toggle') && byId('degree-toggle')));
        log('the scale row stays put on piano',
          Boolean(byId('scale-select') && byId('interval-group')));

        // The rendered keyboard, still on C major / 61 keys
        const keys = byId('keyboard').querySelector('svg');
        log('the keyboard renders as a labelled diagram',
          keys?.getAttribute('aria-label') === 'Keyboard diagram');
        const whiteRects = [...keys.querySelectorAll('rect')]
          .filter((r) => r.getAttribute('fill') === kb.KEY_COLORS.white);
        const blackRects = [...keys.querySelectorAll('rect')]
          .filter((r) => r.getAttribute('fill') === kb.KEY_COLORS.black);
        log('61 keys draw 36 white and 25 black rects',
          whiteRects.length === 36 && blackRects.length === 25,
          `${whiteRects.length} white / ${blackRects.length} black`);
        const keyDots = [...keys.querySelectorAll('.fb-note')];
        log('C major marks all 36 white keys and no black ones',
          keyDots.length === 36, String(keyDots.length));
        log('every C major dot is labelled with a natural',
          keyDots.every((g) => /^[A-G]$/.test(g.querySelector('text').textContent)),
          [...new Set(keyDots.map((g) => g.querySelector('text').textContent))].sort().join(' '));
        log('in-scale keys are clickable',
          whiteRects.every((r) => r.style.cursor === 'pointer'));
        log('out-of-scale keys are inert',
          blackRects.every((r) => r.style.cursor !== 'pointer'));
        log('every octave C is labelled C2 through C7',
          [...keys.querySelectorAll('text')]
            .map((t) => t.textContent)
            .filter((t) => /^C\d$/.test(t))
            .join(' ') === 'C2 C3 C4 C5 C6 C7',
          [...keys.querySelectorAll('text')].map((t) => t.textContent)
            .filter((t) => /^C\d$/.test(t)).join(' '));

        await click(byText('Guitar', byId('mode-group')));
        log('switching back restores the fretboard',
          Boolean(byId('fretboard') && byId('instrument-select') && byId('frets-value')) &&
          !byId('keys-select') && !byId('keyboard'));

        // Extra low strings
        log('board starts as a six string', openLabelsIn(board()).join(' ') === 'E4 B3 G3 D3 A2 E2',
          openLabelsIn(board()).join(' '));
        await click(byId('strings-inc'));
        log('seventh string adds a low B1', openLabelsIn(board()).join(' ') === 'E4 B3 G3 D3 A2 E2 B1',
          openLabelsIn(board()).join(' '));
        await click(byId('strings-inc'));
        log('eighth string adds a low F#1', openLabelsIn(board()).join(' ') === 'E4 B3 G3 D3 A2 E2 B1 F#1',
          openLabelsIn(board()).join(' '));
        log('string readout follows the count', readout('strings-value') === '8', readout('strings-value'));
        await click(byId('strings-inc'));
        log('the stepper stops at eight', readout('strings-value') === '8', readout('strings-value'));
        await click(byId('strings-dec'));
        await click(byId('strings-dec'));
        log('removing extras restores six strings', readout('strings-value') === '6' &&
          openLabelsIn(board()).join(' ') === 'E4 B3 G3 D3 A2 E2', openLabelsIn(board()).join(' '));

        // Intervals -> custom
        await click(inGroup('interval-group')[1]);
        log('changing an interval switches to Custom',
          byId('summary').textContent.includes('Custom'), byId('summary').textContent.trim().slice(0, 40));
        await click(byText('Ionian', root) || inGroup('interval-group')[1]);

        // Handedness
        await click(byId('mode-group').querySelector('button'));
        const beforeX = markers()[0].querySelector('circle').getAttribute('cx');
        await click(byId('hand-toggle'));
        const afterX = markers()[0].querySelector('circle').getAttribute('cx');
        log('lefty mirrors the board', beforeX !== afterX, `${beforeX} -> ${afterX}`);
        await click(byId('hand-toggle'));

        // Spotlight
        await doubleClick(markers()[2]);
        const faded = [...markers()].filter((n) => Number(n.getAttribute('opacity')) < 1).length;
        log('double-click spotlights one pitch', faded > 0 && faded < markers().length, `${faded} faded`);
        await doubleClick(markers()[2]);
        log('double-click again clears the spotlight',
          [...markers()].every((n) => Number(n.getAttribute('opacity')) === 1));

        // Steppers
        const fretsBefore = Number(readout('frets-value'));
        const widthBefore = board().viewBox.baseVal.width;
        await click(byId('frets-dec'));
        log('fret stepper decreases', Number(readout('frets-value')) === fretsBefore - 1,
          `${fretsBefore} -> ${readout('frets-value')}`);
        log('one fewer fret narrows the board', board().viewBox.baseVal.width < widthBefore);
        await click(byId('frets-inc'));
        await click(byId('frets-inc'));
        log('fret count clamps at 24', readout('frets-value') === '24', readout('frets-value'));

        await click(byId('tune-dec'));
        log('tuning down shows -1', readout('tune-value') === '-1', readout('tune-value'));
        await click(byId('tune-inc'));

        // Transport
        // aria-pressed, not data-state: TooltipTrigger asChild overwrites the
        // latter on any toggle it wraps.
        await click(byId('loop-toggle'));
        log('loop toggle presses', byId('loop-toggle').getAttribute('aria-pressed') === 'true',
          `aria-pressed=${byId('loop-toggle').getAttribute('aria-pressed')}`);
        await click(byId('loop-toggle'));
        log('loop toggle releases', byId('loop-toggle').getAttribute('aria-pressed') === 'false');

        /* ---------------- coverage across the data ---------------- */
        const countFor = (patch) => {
          const s = { ...S.initialState, ...patch };
          const pitches = S.pitchMap(s);
          let n = 0;
          for (const open of S.openStrings(s)) {
            for (let f = 0; f <= s.fretCount; f += 1) if (pitches.has((open + f) % 12)) n += 1;
          }
          return n;
        };
        let ok = 0;
        for (const s of theory.ALL_SCALES) if (countFor({ scaleId: s.id }) > 0) ok += 1;
        log('every scale yields notes', ok === 40, `${ok}/40`);
        ok = 0;
        for (const c of theory.ALL_CHORDS) if (countFor({ mode: 'chords', chordId: c.id }) > 0) ok += 1;
        log('every chord yields notes', ok === 20, `${ok}/20`);
        ok = 0;
        for (const t of theory.ALL_TUNINGS) if (countFor({ tuningId: t.id }) > 0) ok += 1;
        log('every tuning yields notes', ok === 25, `${ok}/25`);

        /* ---------------- persistence ---------------- */
        S.saveState({ ...S.initialState, tempo: 145, persist: { ...S.initialState.persist, tempo: true } });
        log('opted-in field persists', S.loadState().tempo === 145);
        S.saveState({ ...S.initialState, tempo: 145 });
        log('opted-out field does not persist', S.loadState().tempo === undefined);
        S.saveState({ ...S.initialState, direction: 'downup', persist: { ...S.initialState.persist, direction: true } });
        log('opted-in direction persists', S.loadState().direction === 'downup', S.loadState().direction);
        localStorage.setItem(S.STORAGE_KEY, JSON.stringify({ persist: { direction: true }, direction: 'sideways' }));
        log('unknown direction falls back to up', S.loadState().direction === 'up', S.loadState().direction);
        localStorage.setItem(S.STORAGE_KEY, JSON.stringify({ defaults: { instrument: 'gone', root: 0, scale: 'gone' } }));
        const stale = S.loadState();
        log('unknown tuning and scale fall back', stale.tuningId === 'standard' && stale.scaleId === 'ionian',
          `${stale.tuningId} / ${stale.scaleId}`);

        S.saveState({
          ...S.initialState,
          meter: '7/8 (2+2+3)',
          clickSound: 'cowbell',
          persist: { ...S.initialState.persist, meter: true, clickSound: true },
        });
        const kept = S.loadState();
        log('opted-in metronome settings persist',
          kept.meter === '7/8 (2+2+3)' && kept.clickSound === 'cowbell',
          `${kept.meter} / ${kept.clickSound}`);
        localStorage.setItem(S.STORAGE_KEY, JSON.stringify({
          persist: { meter: true, rhythm: true, clickSound: true },
          meter: '9/16', rhythm: '1/32', clickSound: 'gong',
        }));
        const junk = S.loadState();
        log('unknown metronome settings fall back',
          junk.meter === '4/4' && junk.rhythm === '1/4' && junk.clickSound === 'blip',
          `${junk.meter} / ${junk.rhythm} / ${junk.clickSound}`);
        localStorage.clear();
      } catch (error) {
        log('uncaught error', false, `${error && error.message} | ${error && error.stack}`);
      }

      log(`${lines.filter((l) => l.startsWith('FAIL')).length} failures of ${lines.length} checks`, true);
    </script>
  </body>
</html>
